<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bé Ôn Tiếng Anh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: một cột kiểu "vở bài tập" — thẻ unit to, nút bấm to cho ngón tay bé, mỗi trò chơi chiếm trọn màn hình */
:root {
  --bg: #e7f2fd;
  --bg-dot: #cfe3f7;
  --card: #ffffff;
  --ink: #1d2742;
  --muted: #5b6785;
  --line: #d6e2f0;
  --sky: #2f7de1;
  --sun: #ffc531;
  --tomato: #f2604b;
  --leaf: #2fa865;
  --grape: #8a5cf5;
  --ok-bg: #dff6e8;
  --bad-bg: #fde4e0;
  --shadow: 0 4px 0 #c3d4e8;
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111a2e; --bg-dot: #1a2642; --card: #1b2640; --ink: #eef3ff; --muted: #a5b2cf;
    --line: #2c3a5c; --sky: #5b9cf0; --sun: #ffcf55; --tomato: #ff7a66; --leaf: #47c07d; --grape: #a483ff;
    --ok-bg: #173a2a; --bad-bg: #42201d; --shadow: 0 4px 0 #0a1020; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111a2e; --bg-dot: #1a2642; --card: #1b2640; --ink: #eef3ff; --muted: #a5b2cf;
  --line: #2c3a5c; --sky: #5b9cf0; --sun: #ffcf55; --tomato: #ff7a66; --leaf: #47c07d; --grape: #a483ff;
  --ok-bg: #173a2a; --bad-bg: #42201d; --shadow: 0 4px 0 #0a1020; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; font-family: var(--body); font-size: 17px; color: var(--ink);
  background: var(--bg);
  background-image: radial-gradient(var(--bg-dot) 1.5px, transparent 1.5px);
  background-size: 22px 22px;
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 820px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.1; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
.btn {
  border: 2px solid var(--line); background: var(--card); border-radius: 16px;
  padding: 10px 16px; font-weight: 800; box-shadow: var(--shadow); transition: transform .08s;
}
.btn:active { transform: translateY(3px); box-shadow: none; }
.btn.primary { background: var(--sky); border-color: var(--sky); color: #fff; }
.btn.sun { background: var(--sun); border-color: var(--sun); color: #1d2742; }

/* Header */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.top .grow { flex: 1; min-width: 0; }
.brand h1 { font-size: clamp(28px, 7vw, 44px); font-weight: 800; letter-spacing: -.5px; }
.brand h1 .en { color: var(--sky); }
.brand p { margin: 2px 0 0; color: var(--muted); font-weight: 700; }
.starpill {
  display: inline-flex; align-items: center; gap: 6px; background: var(--sun); color: #1d2742;
  font-family: var(--display); font-weight: 800; font-size: 22px; padding: 4px 14px; border-radius: 999px;
  font-variant-numeric: tabular-nums;
}
.settings { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; padding: 8px 12px; }
.toggle .sw { width: 34px; height: 20px; border-radius: 99px; background: var(--line); position: relative; transition: background .15s; }
.toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.toggle[aria-pressed="true"] .sw { background: var(--leaf); }
.toggle[aria-pressed="true"] .sw::after { left: 16px; }

/* Unit grid */
.section-label { font-family: var(--display); font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin: 8px 0 10px; }
.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 14px; }
.unit {
  text-align: left; border: 0; border-radius: 22px; padding: 16px; background: var(--card);
  box-shadow: var(--shadow); display: grid; grid-template-columns: 64px 1fr; gap: 4px 12px; align-items: center;
  position: relative; overflow: hidden; min-width: 0;
}
.unit:active { transform: translateY(3px); box-shadow: none; }
.unit .ico { grid-row: span 2; width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; font-size: 36px; background: var(--c); }
.unit .no { font-family: var(--display); font-weight: 800; font-size: 14px; color: var(--c-ink, var(--muted)); letter-spacing: 1px; text-transform: uppercase; }
.unit .name { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.05; }
.unit .vi { grid-column: 2; font-size: 14px; color: var(--muted); font-weight: 700; }
.unit .meter { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--muted); font-weight: 800; font-variant-numeric: tabular-nums; }
.unit .bar { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.unit .bar i { display: block; height: 100%; background: var(--sun); border-radius: 99px; }
.unit.review { background: var(--grape); color: #fff; }
.unit.review .vi, .unit.review .no, .unit.review .meter { color: #f0e9ff; }
.unit.review .ico { background: rgba(255,255,255,.2); }
.unit.review .bar { background: rgba(255,255,255,.25); }
.foot { margin-top: 28px; font-size: 13px; color: var(--muted); line-height: 1.5; max-width: 65ch; }

/* Unit page */
.back { padding: 8px 14px; }
.unit-head { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
.unit-head .ico { width: 72px; height: 72px; flex: none; border-radius: 20px; display: grid; place-items: center; font-size: 42px; background: var(--c); }
.unit-head h2 { font-size: clamp(26px, 6vw, 36px); }
.unit-head p { margin: 2px 0 0; color: var(--muted); font-weight: 700; }
.acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.act { text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 18px; padding: 14px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); min-width: 0; }
.act:active { transform: translateY(3px); box-shadow: none; }
.act .e { font-size: 34px; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 14px; background: var(--bg); flex: none; }
.act b { font-family: var(--display); font-size: 20px; display: block; line-height: 1.1; }
.act small { color: var(--muted); font-weight: 700; font-size: 14px; }
.stars { letter-spacing: 1px; font-size: 16px; }
.stars .off { opacity: .25; filter: grayscale(1); }
.peek { margin-top: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--card); border: 2px solid var(--line); border-radius: 99px; padding: 4px 12px 4px 6px; font-weight: 800; display: inline-flex; gap: 6px; align-items: center; }
.chip .pic { width: 28px; height: 28px; font-size: 22px; }

/* Pictures */
.pic { display: inline-grid; place-items: center; line-height: 1; width: 1.2em; height: 1.2em; }
.pic svg { width: 100%; height: 100%; }
.pic .swatch { width: 80%; height: 80%; border-radius: 50%; border: 3px solid var(--line); }
.pic .num { font-family: var(--display); font-weight: 800; color: var(--sky); font-size: .9em; }

/* Game shell */
.game-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.dots { flex: 1; display: flex; gap: 6px; }
.dots i { flex: 1; height: 10px; border-radius: 99px; background: var(--line); }
.dots i.done { background: var(--leaf); }
.dots i.now { background: var(--sun); }
.prompt { background: var(--card); border-radius: 26px; padding: 22px 16px; text-align: center; box-shadow: var(--shadow); margin-bottom: 16px; }
.prompt .big { font-size: clamp(96px, 26vw, 150px); }
.prompt h3 { font-size: 22px; color: var(--muted); margin-bottom: 8px; }
.speaker { width: 112px; height: 112px; border-radius: 50%; border: 0; background: var(--sky); color: #fff; font-size: 52px; box-shadow: 0 6px 0 #1f5fb0; }
.speaker:active { transform: translateY(4px); box-shadow: none; }
.speaker.small { width: 52px; height: 52px; font-size: 24px; box-shadow: 0 4px 0 #1f5fb0; }
.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.opt { border: 3px solid var(--line); background: var(--card); border-radius: 22px; padding: 12px; min-height: 120px; display: grid; place-items: center; box-shadow: var(--shadow); min-width: 0; }
.opt .pic { font-size: 76px; }
.opt.word { min-height: 84px; font-family: var(--display); font-weight: 800; font-size: clamp(22px, 5.5vw, 30px); overflow-wrap: anywhere; }
.opt.ok { background: var(--ok-bg); border-color: var(--leaf); }
.opt.bad { background: var(--bad-bg); border-color: var(--tomato); animation: shake .35s; }
.opt[disabled] { cursor: default; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }

/* Learn cards */
.learn-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 12px; }
.wcard { border: 3px solid transparent; background: var(--card); border-radius: 20px; padding: 14px 8px 12px; display: grid; justify-items: center; gap: 6px; box-shadow: var(--shadow); min-width: 0; }
.wcard .pic { font-size: 64px; }
.wcard .en { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.05; text-align: center; overflow-wrap: anywhere; }
.wcard .vi { font-size: 14px; color: var(--muted); font-weight: 700; text-align: center; }
.wcard.lit { border-color: var(--sun); animation: pop .35s; }

/* Spell */
.slots { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.slot { width: 48px; height: 58px; border-bottom: 4px solid var(--line); font-family: var(--display); font-weight: 800; font-size: 40px; display: grid; place-items: center; color: var(--leaf); }
.slot.next { border-color: var(--sun); }
.tiles { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.tile { width: 58px; height: 62px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font-family: var(--display); font-weight: 800; font-size: 32px; box-shadow: var(--shadow); }
.tile.used { visibility: hidden; }
.tile.bad { background: var(--bad-bg); border-color: var(--tomato); animation: shake .35s; }

/* Memory */
.mem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 480px) { .mem { grid-template-columns: repeat(3, 1fr); } }
.mcard { aspect-ratio: 3 / 4; max-width: 100%; border: 0; border-radius: 16px; background: var(--sky); color: #fff; font-family: var(--display); font-size: 34px; font-weight: 800; box-shadow: var(--shadow); padding: 4px; min-width: 0; display: grid; place-items: center; }
.mcard.open, .mcard.done { background: var(--card); color: var(--ink); border: 3px solid var(--sun); animation: pop .3s; }
.mcard.done { border-color: var(--leaf); background: var(--ok-bg); }
.mcard .pic { font-size: 52px; }
.mcard .w { font-size: clamp(15px, 4vw, 21px); line-height: 1.05; overflow-wrap: anywhere; }

/* Sentences */
.sents { display: grid; gap: 10px; }
.sent { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 18px; padding: 12px; box-shadow: var(--shadow); border: 3px solid transparent; text-align: left; width: 100%; }
.sent .pic { font-size: 44px; flex: none; }
.sent .txt { flex: 1; min-width: 0; }
.sent .en { font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.2; }
.sent .vi { color: var(--muted); font-size: 14px; font-weight: 700; }
.sent.lit { border-color: var(--sun); }
.answer { min-height: 70px; border: 3px dashed var(--line); border-radius: 18px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin-bottom: 14px; }
.answer.ok { border-style: solid; border-color: var(--leaf); background: var(--ok-bg); }
.answer.bad { border-color: var(--tomato); animation: shake .35s; }
.wtile { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 14px; font-family: var(--display); font-weight: 800; font-size: 24px; box-shadow: var(--shadow); }
.wtile.in { background: var(--sun); border-color: var(--sun); color: #1d2742; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }

/* Finish */
.finish { text-align: center; background: var(--card); border-radius: 28px; padding: 28px 16px; box-shadow: var(--shadow); }
.finish .bigstars { font-size: clamp(54px, 15vw, 80px); letter-spacing: 6px; }
.finish .bigstars span { display: inline-block; animation: pop .5s backwards; }
.finish .bigstars span:nth-child(2) { animation-delay: .2s; }
.finish .bigstars span:nth-child(3) { animation-delay: .4s; }
.finish h2 { font-size: 36px; margin: 8px 0 4px; }
.finish p { color: var(--muted); font-weight: 700; margin: 0; }
.burst { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.burst span { position: absolute; top: -40px; font-size: 28px; animation: fall 1.8s ease-in forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
/* Chọn giáo trình */
.courses { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; background: var(--card); padding: 6px; border-radius: 18px; box-shadow: var(--shadow); }
.course { border: 0; background: transparent; border-radius: 13px; padding: 10px 8px; font-family: var(--display); font-weight: 800; font-size: clamp(15px, 4vw, 19px); color: var(--muted); }
.course[aria-pressed="true"] { background: var(--sky); color: #fff; }

/* Phonics */
.abc { font-family: var(--display); font-weight: 800; font-size: 24px; color: #1d2742; letter-spacing: 1px; }
.unit.review .abc { color: #fff; }
.letters { display: grid; gap: 16px; }
.lt { background: var(--card); border-radius: 22px; padding: 14px; box-shadow: var(--shadow); }
.lt .cards { margin-top: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 120px), 1fr)); }
.lt .wcard { background: var(--bg); box-shadow: none; }
.lt .wcard .pic { font-size: 52px; }
.lbig { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; border: 3px solid transparent; background: var(--bg); border-radius: 18px; padding: 6px 16px; }
.lbig::after { content: "🔊"; margin-left: auto; font-size: 28px; }
.lbig.lit { border-color: var(--sun); animation: pop .35s; }
.lbig .ch, .bigletter { font-family: var(--display); font-weight: 800; font-size: 68px; line-height: 1.1; color: var(--sky); }
.lbig .ch small, .bigletter small { font-size: .8em; color: var(--tomato); margin-left: 6px; }
.lbig .snd { font-family: var(--display); font-weight: 800; font-size: 28px; color: var(--muted); }
.bigletter { font-size: clamp(90px, 24vw, 130px); }
.reveal { min-height: 1.4em; margin: 8px 0; font-family: var(--display); font-size: 26px; color: var(--muted); font-weight: 800; }
.reveal .pic { font-size: 34px; vertical-align: middle; }
.opt.letter { min-height: 100px; font-family: var(--display); font-weight: 800; font-size: clamp(40px, 11vw, 60px); color: var(--sky); }
.ml { font-size: clamp(36px, 10vw, 48px); }
.notice { background: var(--bad-bg); border-radius: 14px; padding: 10px 14px; font-weight: 700; margin-bottom: 14px; }
/* Bài kiểm tra: trình bày giống đề giấy — mỗi phần một tờ, khoanh A/B/C bằng cách chạm */
.exam-cta { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; border: 0; border-radius: 22px; padding: 14px 16px; margin-bottom: 20px; background: var(--leaf); color: #fff; box-shadow: var(--shadow); }
.exam-cta:active { transform: translateY(3px); box-shadow: none; }
.exam-cta .ico { width: 56px; height: 56px; flex: none; border-radius: 16px; background: rgba(255,255,255,.22); display: grid; place-items: center; font-size: 32px; }
.exam-cta b { font-family: var(--display); font-size: 22px; display: block; line-height: 1.1; }
.exam-cta small { font-weight: 700; font-size: 14px; opacity: .92; }
.exam-cta .go { margin-left: auto; font-size: 26px; font-weight: 800; }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 8px; margin-bottom: 18px; }
.pick { text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 8px 12px; box-shadow: var(--shadow); min-width: 0; }
.pick b { font-family: var(--display); font-size: 18px; display: block; line-height: 1.15; }
.pick small { display: block; color: var(--muted); font-weight: 700; font-size: 13px; overflow-wrap: anywhere; }
.pick.inc { border-color: var(--sky); }
.pick[aria-pressed="true"] { background: var(--sky); border-color: var(--sky); color: #fff; }
.pick[aria-pressed="true"] small { color: #e3eeff; }
.paper { background: var(--card); border-radius: 22px; padding: 18px 16px; box-shadow: var(--shadow); margin-bottom: 16px; }
.plan { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px; margin-top: 10px; }
.plan div { background: var(--bg); border-radius: 14px; padding: 10px 12px; font-size: 14px; font-weight: 700; color: var(--muted); }
.plan b { display: block; color: var(--ink); font-family: var(--display); font-size: 18px; }
.hist { display: grid; gap: 6px; }
.hist div { display: flex; justify-content: space-between; gap: 10px; background: var(--card); border-radius: 12px; padding: 8px 12px; font-weight: 700; box-shadow: var(--shadow); }
.hist b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.xhead { display: grid; gap: 14px; }
.xhead h2 { font-size: clamp(28px, 7vw, 38px); color: var(--sky); }
.xmeta { margin: 4px 0 0; color: var(--muted); font-weight: 700; font-size: 15px; line-height: 1.45; }
.namebox { display: flex; align-items: center; gap: 8px; font-weight: 800; }
.namebox input { flex: 1; min-width: 0; font-family: var(--display); font-size: 21px; font-weight: 700; border: 0; border-bottom: 2px dotted var(--muted); background: transparent; color: var(--ink); padding: 2px 4px; border-radius: 0; }
.namebox input:focus { outline: none; border-bottom-color: var(--sky); }
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
.sc { background: var(--bg); border-radius: 12px; padding: 8px 10px; }
.sc small { display: block; color: var(--muted); font-weight: 800; font-size: 13px; }
.sc b { font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; }
.sc.tot { background: var(--sun); color: #1d2742; }
.sc.tot small { color: #4a4220; }
.result { text-align: center; background: var(--bg); border-radius: 16px; padding: 14px; }
.result .bigstars { font-size: 44px; letter-spacing: 4px; }
.result h3 { font-size: 28px; margin: 4px 0; }
.result p { margin: 0; color: var(--muted); font-weight: 700; }
.sec-h h3 { font-size: 26px; }
.instr { font-weight: 800; margin: 8px 0 0; line-height: 1.4; }
.instr .pts { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.instr small { display: block; color: var(--muted); font-weight: 700; font-size: 14px; }
.q { border-top: 2px dashed var(--line); padding-top: 14px; margin-top: 14px; display: grid; gap: 10px; }
.q.ex { opacity: .7; }
.qhead { display: flex; align-items: center; gap: 12px; min-width: 0; }
.qn { flex: none; min-width: 30px; font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qt { flex: 1; min-width: 0; font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.25; overflow-wrap: anywhere; }
.qt b { color: var(--tomato); font-size: 1.25em; }
.qt .kw { font-weight: 500; }
.qt .kw strong { font-weight: 800; color: var(--tomato); }
.qt.word { font-size: 30px; letter-spacing: 2px; white-space: nowrap; overflow-wrap: normal; }
.q.write .chs { max-width: 420px; }
.qp { flex: none; width: 104px; height: 88px; border-radius: 16px; background: var(--bg); display: grid; place-items: center; font-size: 58px; overflow: hidden; }
.exb { margin-left: auto; flex: none; background: var(--sun); color: #1d2742; border-radius: 99px; padding: 2px 10px; font-size: 13px; font-weight: 800; }
.mk { margin-left: auto; flex: none; font-family: var(--display); font-weight: 800; font-size: 28px; }
.mk.ok { color: var(--leaf); }
.mk.no { color: var(--tomato); }
.chs { display: grid; gap: 8px; }
.chs.c3 { grid-template-columns: repeat(3, 1fr); }
.chs.c2 { grid-template-columns: repeat(2, 1fr); max-width: 360px; }

/* File mp3 tạo sẵn bằng tools/gen-audio.mjs (Azure Neural TTS). audio/index.js khai báo AUDIO_FILES = { khóa: tên file };

const AUD = window.AUDIO_FILES || {};
const akey = s => String(s).toLowerCase().replace(/\s+/g, " ").replace(/^[\s.,!?]+|[\s.,!?]+$/g, "");

function clipsFor(text) {
  const whole = AUD[akey(text)];

  const parts = text.split(/(?<=[.,!?])\s+|\s+(?=\/)/).map(akey).filter(Boolean);

  const next = i => {
    if (id !== speakId) return;

    player.onended = () => setTimeout(() => next(i + 1), i + 1 < clips.length ? 220 : 0);
    // Lỗi tải file hoặc trình duyệt chặn phát: đọc phần còn lại bằng giọng trình duyệt
    player.onerror = () => { if (id === speakId) ttsSpeak(text, onend); };

function ttsSpeak(text, onend) {

    ${u.review ? "" : `<div class="peek"><div class="section-label">Từ vựng trong bài</div><div class="chips">${words.map(w => `<span class="chip">${pic(w.e)}${esc(w.en)}</span>`).join("")}</div></div>`}`;
  document.getElementById("back").onclick = () => go(home);
  const map = { learn, listen: u => quiz(u, "listen"), look: u => quiz(u, "look"), spell, memory, sents, order,
    abc, hear: u => letterQuiz(u, "hear"), first: u => letterQuiz(u, "first"), find, case: caseMem };
  $app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => go(() => map[b.dataset.g](u)));
}

function gameTop(u, title, n, i) {
  const dots = n ? `<div class="dots">${Array.from({ length: n }, (_, j) => `<i class="${j < i ? "done" : j === i ? "now" : ""}"></i>`).join("")}</div>` : `<h2 style="flex:1;font-size:24px">${title}</h2>`;
  return `<div class="game-top"><button class="btn back" id="back" aria-label="Quay lại">←</button>${dots}</div>`;
}
function bindBack(u) { document.getElementById("back").onclick = () => go(() => unitPage(u)); }

function finish(u, k, stars, again) {
  const prev = starsOf(u, k);
  if (stars > prev) store.set(`s:${u.id}:${k}`, stars);
  const msg = ["", "Cố lên nhé!", "Giỏi lắm!", "Xuất sắc!"][stars];
  const en = ["", "Good try!", "Great job!", "Excellent!"][stars];
  $app.innerHTML = `${gameTop(u, "", 0)}
    <div class="finish">
      <div class="bigstars">${[1, 2, 3].map(i => `<span style="${i <= stars ? "" : "opacity:.2;filter:grayscale(1)"}">⭐</span>`).join("")}</div>
      <h2>${en}</h2><p>${msg}${stars > prev && prev > 0 ? " Con vừa phá kỷ lục cũ!" : ""}</p>
      <div class="row"><button class="btn sun" id="again">Chơi lại</button><button class="btn primary" id="next">Chọn trò khác</button></div>
    </div>`;
  bindBack(u);
  document.getElementById("again").onclick = () => go(again);
  document.getElementById("next").onclick = () => go(() => unitPage(u));
  if (stars >= 2) burst();
  speak(en);
}
const grade = (mistakes, a, b) => mistakes <= a ? 3 : mistakes <= b ? 2 : 1;

/* 1. Học từ vựng */
function learn(u) {
  const words = u.words.map(W);
  $app.innerHTML = `${gameTop(u, "Học từ vựng", 0)}
    <div class="learn-tools"><button class="btn primary" id="all">▶ Nghe tất cả</button><button class="btn" id="stop" hidden>■ Dừng</button></div>
    <div class="cards">${words.map((w, i) => `<button class="wcard" data-i="${i}">${pic(w.e)}<span class="en">${esc(w.en)}</span>${S.vi ? `<span class="vi">${esc(w.vi)}</span>` : ""}</button>`).join("")}</div>`;
  bindBack(u);
  const cards = [...$app.querySelectorAll(".wcard")];
  const light = i => { cards.forEach(c => c.classList.remove("lit")); if (cards[i]) { cards[i].classList.add("lit"); cards[i].scrollIntoView({ block: "nearest", behavior: "smooth" }); } };
  let playing = false;
  cards.forEach(c => c.onclick = () => { playing = false; light(+c.dataset.i); speak(words[+c.dataset.i].en); });
  const allBtn = document.getElementById("all"), stopBtn = document.getElementById("stop");
  const stop = () => { playing = false; allBtn.hidden = false; stopBtn.hidden = true; stopSpeech(); };
  allBtn.onclick = () => {
    playing = true; allBtn.hidden = true; stopBtn.hidden = false;
    const step = i => { if (!playing || !document.body.contains(allBtn)) return; if (i >= words.length) return stop(); light(i); speak(words[i].en, () => setTimeout(() => step(i + 1), 700)); };
    step(0);
  };
  stopBtn.onclick = stop;
}

/* 2 + 3. Nghe chọn hình / Nhìn hình chọn từ */
function quiz(u, mode) {
  const pool = u.words.map(W);
  const N = Math.min(8, pool.length);
  const targets = sample(pool, N);
  let i = 0, mistakes = 0;
  function round() {
    const t = targets[i];
    const others = shuffle(pool.filter(w => w.e !== t.e && w.en !== t.en));
    const seen = new Set([t.e]); const opts = [t];
    for (const w of others) { if (opts.length === 4) break; if (!seen.has(w.e)) { seen.add(w.e); opts.push(w); } }
    const list = shuffle(opts);
    const prompt = mode === "listen"
      ? `<h3>Nghe và chọn hình đúng</h3><button class="speaker" id="say" aria-label="Nghe lại">🔊</button>`
      : `<h3>Đây là gì?</h3><div class="big">${pic(t.e)}</div>`;
    $app.innerHTML = `${gameTop(u, "", N, i)}<div class="prompt">${prompt}</div>
      <div class="opts">${list.map((w, j) => mode === "listen"
        ? `<button class="opt" data-j="${j}" aria-label="Lựa chọn ${j + 1}">${pic(w.e)}</button>`
        : `<button class="opt word" data-j="${j}">${esc(w.en)}</button>`).join("")}</div>`;
    bindBack(u);
    if (mode === "listen") { document.getElementById("say").onclick = () => speak(t.en); speak(t.en); }
    let locked = false;
    $app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (locked) return;
      const w = list[+b.dataset.j];
      if (w === t) {
        locked = true; b.classList.add("ok"); beep(true);
        $app.querySelectorAll(".opt").forEach(x => x.disabled = true);
        speak(t.en);
        setTimeout(() => { if (!document.body.contains(b)) return; i++; i < N ? round() : finish(u, mode, grade(mistakes, 0, 3), () => quiz(u, mode)); }, 1300);
      } else {
        mistakes++; beep(false); b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad"); b.disabled = true;
        if (mode === "look") speak(w.en);
      }
    });
  }
  round();
}

/* 4. Ghép chữ */
function spell(u) {
  let pool = u.words.map(W).filter(w => /^[a-z]{3,7}$/.test(w.en));
  const N = Math.min(6, pool.length);
  const targets = sample(pool, N);
  let i = 0, mistakes = 0;
  function round() {
    const t = targets[i]; const letters = t.en.split("");
    let tiles = shuffle(letters.map((l, k) => ({ l, k })));
    if (tiles.map(x => x.l).join("") === t.en && letters.length > 2) tiles = [...tiles.slice(1), tiles[0]];
    let pos = 0;
    $app.innerHTML = `${gameTop(u, "", N, i)}
      <div class="prompt"><div class="big">${pic(t.e)}</div>${S.vi ? `<p style="margin:0;color:var(--muted);font-weight:800">${esc(t.vi)}</p>` : ""}
        <div class="slots">${letters.map((_, k) => `<span class="slot ${k === 0 ? "next" : ""}"></span>`).join("")}</div>
        <div class="row" style="margin-top:12px"><button class="speaker small" id="say" aria-label="Nghe từ">🔊</button></div></div>
      <div class="tiles">${tiles.map((x, j) => `<button class="tile" data-j="${j}">${x.l}</button>`).join("")}</div>`;
    bindBack(u);
    document.getElementById("say").onclick = () => speak(t.en);
    speak(t.en);
    const slots = [...$app.querySelectorAll(".slot")];
    $app.querySelectorAll(".tile").forEach(b => b.onclick = () => {
      if (pos >= letters.length) return;
      const x = tiles[+b.dataset.j];
      if (x.l === letters[pos]) {
        slots[pos].textContent = x.l; slots[pos].classList.remove("next"); b.classList.add("used"); pos++;
        if (slots[pos]) slots[pos].classList.add("next");
        if (pos === letters.length) { beep(true); speak(t.en); setTimeout(() => { if (!document.body.contains(b)) return; i++; i < N ? round() : finish(u, "spell", grade(mistakes, 2, 6), () => spell(u)); }, 1300); }
      } else { mistakes++; beep(false); b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad"); }
    });
  }
  round();
}

/* 5. Lật thẻ */
function memory(u) {
  const seen = new Set(); const picks = [];
  for (const w of shuffle(u.words.map(W))) { if (picks.length === 6) break; if (!seen.has(w.e)) { seen.add(w.e); picks.push(w); } }
  pairGame(u, "memory", picks.map(w => ({ a: pic(w.e), b: `<span class="w">${esc(w.en)}</span>`, sayB: w.en, say: w.en })), () => memory(u));
}

/* Lật thẻ dùng chung: mỗi item là một cặp thẻ a/b; say = câu đọc khi ghép đúng */
function pairGame(u, key, items, again) {
  const cards = shuffle(items.flatMap((it, k) => [{ k, t: "a", it }, { k, t: "b", it }]));
  let open = [], done = 0, mistakes = 0, busy = false;
  $app.innerHTML = `${gameTop(u, "Lật thẻ tìm cặp", 0)}<div class="mem">${cards.map((c, j) => `<button class="mcard" data-j="${j}" aria-label="Thẻ ${j + 1}">?</button>`).join("")}</div>`;
  bindBack(u);
  const els = [...$app.querySelectorAll(".mcard")];
  const face = (j, on) => { const c = cards[j], el = els[j]; el.classList.toggle("open", on); el.innerHTML = on ? c.it[c.t] : "?"; };
  els.forEach((el, j) => el.onclick = () => {
    if (busy || el.classList.contains("done") || open.includes(j)) return;
    face(j, true); open.push(j);
    const flipSay = cards[j].t === "a" ? cards[j].it.sayA : cards[j].it.sayB;
    if (flipSay) speak(flipSay);
    if (open.length === 2) {
      const [a, b] = open;
      if (cards[a].k === cards[b].k) {
        els[a].classList.add("done"); els[b].classList.add("done"); open = []; done++; beep(true); speak(cards[a].it.say);
        if (done === items.length) setTimeout(() => document.body.contains(el) && finish(u, key, grade(mistakes, 4, 9), again), 1100);
      } else {
        mistakes++; busy = true;
        setTimeout(() => { face(a, false); face(b, false); open = []; busy = false; }, 1000);
      }
    }
  });
}

/* 6. Mẫu câu */
function sents(u) {
  const list = u.sents.map(W);
  const hasOrder = u.course.games.some(g => g.k === "order");
  $app.innerHTML = `${gameTop(u, "Mẫu câu", 0)}
    <div class="learn-tools"><button class="btn primary" id="all">▶ Nghe tất cả</button>${hasOrder ? `<button class="btn sun" id="toorder">🧩 Xếp câu</button>` : ""}</div>
    <div class="sents">${list.map((s, i) => `<button class="sent" data-i="${i}">${pic(s.e)}<span class="txt"><span class="en">${esc(s.en)}</span>${S.vi ? `<br><span class="vi">${esc(s.vi)}</span>` : ""}</span><span aria-hidden="true">🔊</span></button>`).join("")}</div>`;
  bindBack(u);
  const els = [...$app.querySelectorAll(".sent")];
  const light = i => { els.forEach(e => e.classList.remove("lit")); els[i] && els[i].classList.add("lit"); };
  let playing = false;
  els.forEach(e => e.onclick = () => { playing = false; light(+e.dataset.i); speak(list[+e.dataset.i].en); });
  const all = document.getElementById("all");
  all.onclick = () => { playing = true; const step = i => { if (!playing || !document.body.contains(all) || i >= list.length) return; light(i); speak(list[i].en, () => setTimeout(() => step(i + 1), 900)); }; step(0); };
  if (hasOrder) document.getElementById("toorder").onclick = () => go(() => order(u));
}

/* 7. Xếp câu */
function order(u) {
  const segs = [];
  for (const s of u.sents.map(W)) {
    for (const part of s.en.split(/(?<=[.?!])\s+/)) {
      const n = part.split(" ").length;
      if (n >= 2 && n <= 7 && !segs.some(x => x.en === part)) segs.push({ en: part, e: s.e, vi: s.vi, whole: part === s.en });
    }
  }
  const N = Math.min(5, segs.length);
  const targets = sample(segs, N);
  let i = 0, mistakes = 0;
  function round() {
    const t = targets[i]; const words = t.en.split(" ");
    let bank = shuffle(words.map((w, k) => ({ w, k })));
    if (bank.map(x => x.w).join(" ") === t.en) bank = [...bank.slice(1), bank[0]];
    let ans = [];
    const draw = () => {
      $app.innerHTML = `${gameTop(u, "", N, i)}
        <div class="prompt"><div class="big" style="font-size:90px">${pic(t.e)}</div>${S.vi && t.whole ? `<p style="margin:0 0 10px;color:var(--muted);font-weight:800">${esc(t.vi)}</p>` : ""}<button class="speaker small" id="say" aria-label="Nghe câu">🔊</button></div>
        <div class="answer" id="ans">${ans.map((x, j) => `<button class="wtile in" data-a="${j}">${esc(x.w)}</button>`).join("") || `<span style="color:var(--muted);font-weight:700">Chạm vào các từ bên dưới theo đúng thứ tự</span>`}</div>
        <div class="tiles">${bank.map((x, j) => `<button class="wtile" data-b="${j}">${esc(x.w)}</button>`).join("")}</div>
        <div class="row"><button class="btn primary" id="check" ${bank.length ? "disabled style='opacity:.5'" : ""}>Kiểm tra</button></div>`;
      bindBack(u);
      document.getElementById("say").onclick = () => speak(t.en);
      $app.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { const x = bank.splice(+b.dataset.b, 1)[0]; ans.push(x); speak(x.w); draw(); });
      $app.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { bank.push(ans.splice(+b.dataset.a, 1)[0]); draw(); });
      document.getElementById("check").onclick = () => {
        if (bank.length) return;
        const box = document.getElementById("ans");
        if (ans.map(x => x.w).join(" ") === t.en) {
          box.classList.add("ok"); beep(true);
          $app.querySelectorAll("button.wtile, #check").forEach(x => x.disabled = true);
          speak(t.en, () => setTimeout(() => { if (!document.body.contains(box)) return; i++; i < N ? round() : finish(u, "order", grade(mistakes, 0, 3), () => order(u)); }, 500));
        } else { mistakes++; beep(false); box.classList.remove("bad"); void box.offsetWidth; box.classList.add("bad"); }
      };
    };
    draw(); speak(t.en);
  }
  round();
}

/* Chữ cái và âm: mỗi chữ một khung, chạm chữ nghe tên chữ + các từ khóa */
function abc(u) {

      <div class="cards">${l.words.map((w, j) => `<button class="wcard" data-l="${i}" data-w="${j}">${pic(w[2])}<span class="en">${esc(w[0])}</span>${S.vi ? `<span class="vi">${esc(w[1])}</span>` : ""}</button>`).join("")}</div>
    </section>`).join("")}</div>`;
  bindBack(u);
  const all = [...$app.querySelectorAll(".lbig, .lt .wcard")];

  const light = el => { all.forEach(x => x.classList.remove("lit")); if (el) { el.classList.add("lit"); el.scrollIntoView({ block: "nearest", behavior: "smooth" }); } };
  let playing = false;
  all.forEach(el => el.onclick = () => {
    playing = false; light(el);

    speak(el.dataset.w == null ? `${sayLetter(l)}. ${l.words.map(w => w[0]).join(", ")}` : textOf(el));

    playing = true; allBtn.hidden = true; stopBtn.hidden = false;
    const step = i => { if (!playing || !document.body.contains(allBtn)) return; if (i >= all.length) return stop(); light(all[i]); speak(textOf(all[i]), () => setTimeout(() => step(i + 1), 600)); };
    step(0);

/* Nghe từ / nhìn hình → chọn chữ cái mang âm đó */
function letterQuiz(u, mode) {
  const pool = u.words.map(W);
  const N = Math.min(8, pool.length);
  const targets = sample(pool, N);
  const letters = u.letters.length >= 3 ? u.letters : SG_LETTERS;
  let i = 0, mistakes = 0;
  function round() {
    const t = targets[i], tl = LETTER[t.L];
    // Bỏ chữ cùng âm (c/k) và chữ mà từ cũng chứa (box có cả b lẫn x) để chỉ có một đáp án đúng
    const others = shuffle(letters.filter(l => l.L !== t.L && l.snd !== tl.snd && !hasL(t.en, l)));
    const list = shuffle([tl, ...others.slice(0, u.review ? 3 : 2)]);
    const prompt = mode === "hear"
      ? `<h3>Con nghe thấy âm của chữ nào?</h3><button class="speaker" id="say" aria-label="Nghe lại">🔊</button>`
      : `<h3>Tranh này có âm của chữ nào?</h3><div class="big">${pic(t.e)}</div>`;
    $app.innerHTML = `${gameTop(u, "", N, i)}<div class="prompt">${prompt}<p class="reveal" id="reveal"></p></div>
      <div class="opts" style="grid-template-columns:repeat(${list.length === 3 ? 3 : 2},1fr)">${list.map((l, j) => `<button class="opt letter" data-j="${j}">${UP(l.L)}</button>`).join("")}</div>`;
    bindBack(u);
    if (mode === "hear") { document.getElementById("say").onclick = () => speak(t.en); speak(t.en); }
    let locked = false;
    $app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (locked) return;
      if (list[+b.dataset.j] === tl) {
        locked = true; b.classList.add("ok"); beep(true);
        $app.querySelectorAll(".opt").forEach(x => x.disabled = true);
        document.getElementById("reveal").innerHTML = `${mode === "hear" ? pic(t.e) + " " : ""}<b>${esc(t.en)}</b>`;
        speak(t.en);
        setTimeout(() => { if (!document.body.contains(b)) return; i++; i < N ? round() : finish(u, mode, grade(mistakes, 0, 3), () => letterQuiz(u, mode)); }, 1500);
      } else {
        mistakes++; beep(false); b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad"); b.disabled = true;
      }
    });
  }
  round();
}

/* Cho chữ cái → tìm bức tranh có âm của chữ đó */
function find(u) {
  const pool = u.words.map(W);
  const N = Math.min(8, pool.length);
  const targets = sample(pool, N);
  let i = 0, mistakes = 0;
  function round() {
    const t = targets[i], tl = LETTER[t.L];
    const ok = w => w.e !== t.e && !hasL(w.en, tl) && LETTER[w.L].snd !== tl.snd;
    let others = shuffle(pool.filter(ok));
    if (others.length < 3) others = [...others, ...shuffle(SG_LETTERS.flatMap(l => l.words.map(w => W([...w, l.L]))).filter(w => ok(w) && !others.includes(w)))];
    const seen = new Set([t.e]); const opts = [t];
    for (const w of others) { if (opts.length === 4) break; if (!seen.has(w.e)) { seen.add(w.e); opts.push(w); } }
    const list = shuffle(opts);
    $app.innerHTML = `${gameTop(u, "", N, i)}
      <div class="prompt"><h3>Hình nào có âm của chữ này?</h3><div class="bigletter">${tl.L.toUpperCase()}<small>${tl.L}</small></div>
        <p class="reveal">${tl.snd}</p><button class="speaker small" id="say" aria-label="Nghe chữ cái">🔊</button></div>
      <div class="opts">${list.map((w, j) => `<button class="opt" data-j="${j}" aria-label="Lựa chọn ${j + 1}">${pic(w.e)}</button>`).join("")}</div>`;
    bindBack(u);
    document.getElementById("say").onclick = () => speak(sayLetter(tl));
    speak(sayLetter(tl));
    let locked = false;
    $app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (locked) return;
      const w = list[+b.dataset.j];
      if (w === t) {
        locked = true; b.classList.add("ok"); beep(true);
        $app.querySelectorAll(".opt").forEach(x => x.disabled = true);
        speak(`${tl.L.toUpperCase()}. ${t.en}`);
        setTimeout(() => { if (!document.body.contains(b)) return; i++; i < N ? round() : finish(u, "find", grade(mistakes, 0, 3), () => find(u)); }, 1500);
      } else {
        mistakes++; beep(false); b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad"); b.disabled = true; speak(w.en);
      }
    });
  }
  round();
}

/* Ghép chữ hoa với chữ thường; unit ít chữ thì thêm chữ đã học trước đó cho đủ 6 cặp */
function caseMem(u) {
  let picks = sample(u.letters, 6);
  if (picks.length < 6) {
    const start = SG_LETTERS.indexOf(u.letters[0]);
    const learned = shuffle(SG_LETTERS.slice(0, start)), later = shuffle(SG_LETTERS.slice(start + u.letters.length));
    picks = [...picks, ...learned, ...later].slice(0, 6);
  }
  pairGame(u, "case", picks.map(l => ({ a: `<span class="ml">${l.L.toUpperCase()}</span>`, b: `<span class="ml">${l.L}</span>`, sayA: l.L.toUpperCase(), sayB: l.L.toUpperCase(), say: `${l.L.toUpperCase()}. ${l.words[0][0]}` })), () => caseMem(u));
}

}
const K = "ABCDEFG";
const SECS = [["pho", "Phonetics"], ["voc", "Vocabulary"], ["gra", "Grammar"], ["rea", "Reading"], ["wri", "Writing"]];

function makeExam(eow, sg) {
  const c = examCtx(eow, sg);
  const gram = () => { const r = pickT(c, G).f(c); if (r.ok === r.bad) return null; const o = shuffle([r.ok, r.bad]); return { pic: r.pic, q: r.q, opts: o, ans: o.indexOf(r.ok), sig: r.q + r.ok }; };
  const pho = many(7, () => genPho(c));
  const vocA = many(7, i => genVocA(c, i === 3 || i === 6));
  const vocB = many(7, () => genVocB(c));
  const gra = many(8, gram);
  // Nối: ví dụ + 5 câu, thêm 1 câu trả lời thừa; mỗi câu trả lời khác nhau để chỉ có một cách nối đúng
  const mt = many(7, () => { const r = pickT(c, G).f(c); return { pic: r.pic, q: r.q, ok: r.ok, sig: r.ok }; });
  const answers = [mt[0].ok, ...shuffle(mt.slice(1).map(x => x.ok))];
  const match = mt.slice(0, 6).map(x => ({ pic: x.pic, q: x.q, opts: answers.map((_, j) => K[j]), ans: answers.indexOf(x.ok) }));
  const yes = [true, ...shuffle([true, true, false, false, Math.random() < .5])];
  const rea = many(6, i => { const r = pickT(c, R).f(c, yes[i]); return { pic: r.pic, q: r.s, opts: ["Yes", "No"], ans: yes[i] ? 0 : 1, sig: r.s }; });
  const wri = many(6, () => genWrite(c));
  const parts = [
    { sec: "pho", head: "I. Phonetics", no: 1, en: "Look at the pictures and sounds. CIRCLE the correct answers.", vi: "Đọc âm, khoanh vào tranh có âm đó ở đầu từ.", lay: "pics", items: pho },
    { sec: "voc", head: "II. Vocabulary", no: 2, en: "Look at the pictures. CIRCLE the correct answers.", vi: "Nhìn tranh, khoanh vào từ đúng.", lay: "words", items: vocA },
    { sec: "voc", no: 3, en: "Read, look and CIRCLE the correct answers.", vi: "Đọc từ, khoanh vào tranh đúng.", lay: "pics", items: vocB },
    { sec: "gra", head: "III. Grammar", no: 4, en: "Look and read. CIRCLE the correct answers.", vi: "Nhìn tranh, đọc câu hỏi, khoanh câu trả lời đúng.", lay: "qa", items: gra },
    { sec: "gra", no: 5, en: "Read. MATCH the questions with the answers.", vi: "Nối câu hỏi với câu trả lời: chọn chữ cái của câu trả lời.", lay: "match", items: match, answers },
    { sec: "rea", head: "IV. Reading", no: 6, en: "Look and read. CIRCLE the correct answer.", vi: "Nhìn tranh, đọc câu. Câu đúng với tranh chọn Yes, sai chọn No.", lay: "yn", items: rea },
    { sec: "wri", head: "V. Writing", no: 7, en: "Look. CIRCLE the correct answer. WRITE.", vi: "Nhìn tranh, chọn chữ cái còn thiếu trong từ.", lay: "write", items: wri, pts: 2 },
  ];
  let id = 0, n = 0;
  for (const p of parts) p.items.forEach((it, j) => {
    Object.assign(it, { id: id++, ex: j === 0, sec: p.sec, pts: p.pts || 1 });
    it.sel = it.ex ? it.ans : null;
    if (!it.ex) it.n = ++n;
  });
  return { eow, sg, parts, done: false };
}

const EXAM = { eow: store.get("x:eow", 1), sg: store.get("x:sg", 1) };
const eowName = i => i === 0 ? "Welcome" : "Unit " + i;

function examSetup() {
  document.title = "Bài kiểm tra · Bé Ôn English";
  const hist = store.get("x:hist", []);
  $app.innerHTML = `
    <div class="top"><button class="btn back" id="back">← Trang chủ</button></div>
    <div class="unit-head" style="--c:#d3f3dc"><span class="ico">📝</span><div><p>Bài kiểm tra tổng hợp</p><h2>Tạo đề thi thử</h2><p>40 câu · 45 điểm · khoảng 40 phút</p></div></div>
    <div class="section-label">Explore Our World 1 — bé đang học tới</div>
    <div class="picks" data-k="eow">${UNITS.map((u, i) => `<button class="pick" data-v="${i}"><b>${eowName(i)}</b><small>${esc(u.title)}</small></button>`).join("")}</div>
    <div class="section-label">Sounds Great 1 — bé đang học tới</div>
    <div class="picks" data-k="sg">${SG_UNITS.map(u => `<button class="pick" data-v="${u.no}"><b>Unit ${u.no}</b><small>${esc(u.title)}</small></button>`).join("")}</div>
    <div class="paper">
      <b>Đề gồm 5 phần như đề ở trường</b>
      <div class="plan">
        <div><b>Phonetics · 6 điểm</b>Âm chữ cái (Sounds Great) với tranh từ vựng cả 2 sách</div>
        <div><b>Vocabulary · 12 điểm</b>Nhìn tranh chọn từ, đọc từ chọn tranh</div>
        <div><b>Grammar · 12 điểm</b>Mẫu câu Explore Our World: chọn câu trả lời và nối</div>
        <div><b>Reading · 5 điểm</b>Đọc câu, xem tranh, chọn Yes/No</div>
        <div><b>Writing · 10 điểm</b>Chọn chữ cái còn thiếu trong từ</div>
      </div>
      <p class="xmeta" id="scope"></p>
    </div>
    <div class="row"><button class="btn primary" id="make" style="font-size:22px;padding:14px 28px">📝 Tạo đề</button></div>
    ${hist.length ? `<div class="section-label" style="margin-top:26px">Các lần làm gần đây</div><div class="hist">${hist.slice(0, 6).map(h => `<div><span>${new Date(h.t).toLocaleDateString("vi-VN")} · EOW ${eowName(h.eow)} · SG Unit ${h.sg}</span><b>${h.total}/${h.max}</b></div>`).join("")}</div>` : ""}`;
  document.getElementById("back").onclick = () => go(home);
  const paint = () => {
    $app.querySelectorAll(".picks").forEach(box => box.querySelectorAll(".pick").forEach(b => {
      const v = +b.dataset.v, cur = EXAM[box.dataset.k];
      b.setAttribute("aria-pressed", v === cur); b.classList.toggle("inc", v < cur);
    }));
    document.getElementById("scope").textContent = `Kiến thức từ đầu tới ${eowName(EXAM.eow)} (Explore Our World) và Unit ${EXAM.sg} (Sounds Great, chữ ${SG_UNITS.slice(0, EXAM.sg).flatMap(u => u.letters).map(l => l.L.toUpperCase()).join(" ")}). Bài đang học và bài ngay trước được ra nhiều câu hơn.`;
  };
  $app.querySelectorAll(".picks").forEach(box => box.querySelectorAll(".pick").forEach(b => b.onclick = () => {
    EXAM[box.dataset.k] = +b.dataset.v; store.set("x:" + box.dataset.k, EXAM[box.dataset.k]); paint();
  }));
  paint();
  document.getElementById("make").onclick = () => go(() => examPage(makeExam(EXAM.eow, EXAM.sg)));
}

function examPage(T) {
  document.title = "Practice Test · Lớp 1";
  const items = T.parts.flatMap(p => p.items), real = items.filter(i => !i.ex);
  const byId = Object.fromEntries(items.map(i => [i.id, i]));
  const score = list => list.filter(i => !i.ex).reduce((a, i) => a + (T.done && i.sel === i.ans ? i.pts : 0), 0);
  const maxOf = list => list.filter(i => !i.ex).reduce((a, i) => a + i.pts, 0);
  const bySec = k => real.filter(i => i.sec === k);
  const total = score(real), max = maxOf(real);
  const stars = total >= max * .9 ? 3 : total >= max * .7 ? 2 : 1;
  const wrong = real.filter(i => i.sel !== i.ans).length;
  const letters = SG_UNITS.slice(0, T.sg).flatMap(u => u.letters);

  const qHtml = (p, it) => {
    const lock = it.ex || T.done;
    const st = j => T.done && !it.ex ? (j === it.ans ? " right" : j === it.sel ? " wrong" : "") : "";
    const btn = (j, inner, cls = "") => `<button class="ch${cls}${st(j)}" data-q="${it.id}" data-j="${j}" aria-pressed="${it.sel === j}"${lock ? " disabled" : ""}><span class="k">${K[j]}</span>${inner}</button>`;
    const num = `<span class="qn">${it.ex ? 0 : it.n}.</span>`;
    const qp = it.pic ? `<span class="qp">${it.pic}</span>` : "";
    const mark = it.ex ? `<span class="exb">Ví dụ</span>` : T.done ? (it.sel === it.ans ? `<span class="mk ok" aria-label="Đúng">✓</span>` : `<span class="mk no" aria-label="Sai">✗</span>`) : "";
    let head, chs;
    if (p.lay === "pics") { head = `${num}<span class="qt">${it.q}</span>`; chs = `<div class="chs c3">${it.opts.map((o, j) => btn(j, o, " pico")).join("")}</div>`; }
    else if (p.lay === "words") { head = num + qp; chs = `<div class="chs c3">${it.opts.map((o, j) => btn(j, `<span>${esc(o)}</span>`)).join("")}</div>`; }
    else if (p.lay === "write") {
      const w = it.word;
      head = `${num}${qp}<span class="qt word">${esc(w.slice(0, it.at))}<span class="blank">${it.sel == null ? "&nbsp;" : it.opts[it.sel]}</span>${esc(w.slice(it.at + 1))}</span>`;
      chs = `<div class="chs c3">${it.opts.map((o, j) => btn(j, `<span>${o}</span>`, " big")).join("")}</div>`;
    } else {
      head = `${num}${qp}<span class="qt">${esc(it.q)}</span>`;
      chs = p.lay === "match" ? `<div class="chs cl">${it.opts.map((o, j) => btn(j, "", " only")).join("")}</div>`
        : `<div class="chs${p.lay === "yn" ? " c2" : ""}">${it.opts.map((o, j) => btn(j, `<span>${esc(o)}</span>`)).join("")}</div>`;
    }
    return `<div class="q ${p.lay}${it.ex ? " ex" : ""}"><div class="qhead">${head}${mark}</div>${chs}</div>`;
  };
  const partHtml = p => `<section class="paper">
    ${p.head ? `<div class="sec-h"><h3>${p.head}</h3></div>` : ""}
    <p class="instr">${p.no}. ${p.en} There is one example. <span class="pts">(${T.done ? score(p.items) : "……"}/${maxOf(p.items)} pts)</span>${S.vi ? `<small>${p.vi}</small>` : ""}</p>
    ${p.answers ? `<div class="ansbox">${p.answers.map((a, j) => `<div><b>${K[j]}.</b>${esc(a)}</div>`).join("")}</div>` : ""}
    ${p.items.map(it => qHtml(p, it)).join("")}
  </section>`;

  $app.innerHTML = `
    <div class="top noprint"><button class="btn back" id="back">← Chọn bài</button><span class="grow"></span><button class="btn" id="print">🖨️ In đề</button><button class="btn sun" id="new">🔄 Đề khác</button></div>
    <div id="exam">
      <section class="paper xhead">
        <div><h2>PRACTICE TEST</h2><p class="xmeta">Môn Tiếng Anh · Lớp 1 · Thời gian làm bài: 40 phút<br>Explore Our World 1: tới ${eowName(T.eow)} · Sounds Great 1: tới Unit ${T.sg} (${letters[0].L.toUpperCase()}–${letters[letters.length - 1].L.toUpperCase()})</p></div>
        <label class="namebox">Họ và tên: <input id="nm" value="${esc(store.get("x:name", ""))}" autocomplete="off" spellcheck="false"></label>
        <div class="scores">${SECS.map(([k, t]) => `<div class="sc"><small>${t}</small><b>${T.done ? score(bySec(k)) : "…"}/${maxOf(bySec(k))}</b></div>`).join("")}<div class="sc tot"><small>Tổng điểm</small><b>${T.done ? total : "…"}/${max}</b></div></div>
        ${T.done ? `<div class="result"><div class="bigstars">${[1, 2, 3].map(i => `<span style="${i <= stars ? "" : "opacity:.2;filter:grayscale(1)"}">⭐</span>`).join("")}</div>
          <h3>${["", "Good try!", "Great job!", "Excellent!"][stars]}</h3>
          <p>${wrong ? `Con sai ${wrong} câu. Ô đỏ là con chọn sai, ô xanh là đáp án đúng.` : "Con làm đúng hết! Giỏi quá!"}</p></div>` : ""}
      </section>
      ${T.parts.map(partHtml).join("")}
      <div class="xfoot noprint">${T.done
        ? `<button class="btn sun" id="new2">🔄 Làm đề khác</button><button class="btn primary" id="home2">Trang chủ</button>`
        : `<span class="xmeta" id="cnt"></span><button class="btn primary" id="submit" style="font-size:20px;padding:12px 26px">✅ Nộp bài</button>`}</div>
    </div>`;

  const fresh = () => go(() => examPage(makeExam(T.eow, T.sg)));
  document.getElementById("back").onclick = () => go(examSetup);
  document.getElementById("print").onclick = () => window.print();
  document.getElementById("new").onclick = () => { if (T.done || real.every(i => i.sel == null) || confirm("Bỏ bài đang làm và tạo đề khác?")) fresh(); };
  document.getElementById("nm").oninput = e => store.set("x:name", e.target.value);
  if (T.done) {
    document.getElementById("new2").onclick = fresh;
    document.getElementById("home2").onclick = () => go(home);
    if (!T.saved) {
      T.saved = true;
      store.set("x:hist", [{ t: Date.now(), eow: T.eow, sg: T.sg, total, max }, ...store.get("x:hist", [])].slice(0, 20));
      if (stars >= 2) burst();
      speak(["", "Good try!", "Great job!", "Excellent!"][stars]);
    }
    return;
  }
  const cnt = document.getElementById("cnt");
  const count = () => cnt.textContent = `Đã làm ${real.filter(i => i.sel != null).length}/${real.length} câu`;
  count();
  document.getElementById("exam").onclick = e => {
    const b = e.target.closest(".ch[data-q]");
    if (!b || b.disabled) return;
    const it = byId[b.dataset.q];
    it.sel = +b.dataset.j;
    b.parentElement.querySelectorAll(".ch").forEach(x => x.setAttribute("aria-pressed", x === b));
    const blank = b.closest(".q").querySelector(".blank");
    if (blank) blank.textContent = it.opts[it.sel];
    count();
  };
  document.getElementById("submit").onclick = () => {
    const left = real.filter(i => i.sel == null).length;
    if (left && !confirm(`Con còn ${left} câu chưa làm. Vẫn nộp bài nhé?`)) return;
    T.done = true;
    go(() => examPage(T));
  };
}

home();
</script>
